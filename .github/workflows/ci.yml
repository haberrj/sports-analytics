name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nfl_analysis
          POSTGRES_USER: nfl
          POSTGRES_PASSWORD: nfl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfl -d nfl_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: nfl_analysis
      POSTGRES_USER: nfl
      POSTGRES_PASSWORD: nfl
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          bazelisk-cache: true
          repository-cache: true
          disk-cache: ${{ github.workflow }}

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Ruff lint
        run: uv run --with ruff ruff check .

      - name: Ruff format check
        run: uv run --with ruff ruff format --check .

      - name: Django system check
        run: bazel run //src:manage -- check

      - name: Check migrations
        run: bazel run //src:manage -- makemigrations --check --dry-run

      - name: Bazel build
        run: bazel build //...

      - name: Bazel tests
        run: bazel test //...