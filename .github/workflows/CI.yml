name: CI

on:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: nfl_analysis
          POSTGRES_USER: nfl
          POSTGRES_PASSWORD: nfl
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nfl -d nfl_analysis"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      POSTGRES_DB: nfl_analysis
      POSTGRES_USER: nfl
      POSTGRES_PASSWORD: nfl
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      DJANGO_DEBUG: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Django system check
        run: uv run python src/manage.py check

      - name: Check migrations
        run: uv run python src/manage.py makemigrations --check --dry-run

      - name: Apply migrations
        run: uv run python src/manage.py migrate

      - name: Run tests with coverage
        run: |
          set -o pipefail
          uv run pytest \
          --cov=src \
          --cov-report=term-missing \
          --cov-report=xml \
          --cov-fail-under=80 \
          | tee coverage.txt
      
      - name: Add coverage to job summary
        if: always()
        run: |
          {
            echo "## Test Coverage"
            echo
            echo '```text'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            coverage.xml
            coverage.txt
            htmlcov/
          retention-days: 30