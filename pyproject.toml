[project]
name = "sports-analytics"
version = "0.1.0"
description = "Professional sports analytics, prediction, betting, and fantasy league platform"
readme = "README.md"
authors = [
    { name = "Ron Haber", email = "haberrj95@gmail.com" }
]
requires-python = ">=3.12, <3.13"
dependencies = [
    "django>=5.2,<6.0",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.7",
    "nflreadpy>=0.1.5",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.9",
    "ruff>=0.12",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [
    "**/migrations/*.py",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["src"]
python_files = [
    "test_*.py",
    "*_test.py",
]

[tool.coverage.run]
source = ["src"]
omit = [
    "*/migrations/*",
    "*/tests/*",
    "src/manage.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80
