services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    command: uv run python src/manage.py runserver 0.0.0.0:8000

    volumes:
      - ./src:/app/src

    # Temporary while we verify the Cloudflare tunnel.
    # We can remove this once Cloudflare is working.
    ports:
      - "8001:8000"

    env_file:
      - .env

    depends_on:
      db:
        condition: service_healthy

    restart: unless-stopped

  db:
    image: postgres:17

    env_file:
      - .env

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest

    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${CLOUDFLARE_TUNNEL_TOKEN}

    depends_on:
      - web

    restart: unless-stopped

volumes:
  postgres_data: